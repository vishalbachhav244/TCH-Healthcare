      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'day'
          in: 'query'
          schema:
            type: 'string'
            format: 'date'
          description: 'Defaults to today in Asia/Kolkata.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/BillingOptions' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/portal':
    get:
      operationId: 'getPatientPortal'
      summary: "Read the signed-in patient's own visits, follow-up requests, released reports and bills."
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Portal' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/portal/appointments':
    post:
      operationId: 'bookMyAppointment'
      summary: 'Reserve a slot for the signed-in patient.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['practitionerId', 'time', 'day']
              properties:
                practitionerId:
                  type: 'string'
                time:
                  type: 'string'
                day:
                  type: 'string'
                  format: 'date'
      responses:
