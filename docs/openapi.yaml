      operationId: 'issueMyPass'
      summary: 'Issue or retrieve a scoped appointment pass.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['appointmentId']
              properties:
                appointmentId:
                  type: 'string'
      responses:
        '201':
          description: 'Success.'
