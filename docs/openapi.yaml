        - $ref: '#/components/parameters/Facility'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encounterId: &a2
                  type: string
                productId: *a2
                quantity: *a2
              required:
                - encounterId
                - productId
                - quantity
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
  /clinical/prescriptions/sign:
    post:
      operationId: signPrescription
      summary: Sign the assigned clinician’s draft prescription.
      parameters:
        - $ref: '#/components/parameters/Facility'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prescriptionId:
                  type: string
              required:
                - prescriptionId
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
  /pharmacy:
    get:
      operationId: getPharmacyWorklist
      summary: Read the facility dispensing worklist and stock lots.
      parameters:
        - $ref: '#/components/parameters/Facility'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyData'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
  /pharmacy/dispense:
    post:
      operationId: dispenseSignedPrescription
      summary: Dispense once from a valid lot and post a separate medicine invoice.
      parameters:
        - $ref: '#/components/parameters/Facility'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prescriptionId:
                  type: string
                lotId:
                  type: string
              required:
                - prescriptionId
                - lotId
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
  /platform-operations:
    get:
      operationId: getPlatformOperations
      summary: Read incident records, current counts and recent event metadata.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperationsData'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
  /platform-operations/incidents:
    post:
      operationId: openPlatformIncident
      summary: Open an incident for a workspace service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - service
                - priority
              properties:
                title:
                  type: string
                service:
                  type: string
                priority:
                  type: string
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      operationId: advancePlatformIncident
      summary: Advance the incident lifecycle at the expected version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - version
              properties:
                id: &a4
                  type: string
                version: *a4
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    sessionToken:
      type: 'http'
      scheme: 'bearer'
      bearerFormat: 'opaque evaluation token'
  parameters:
    Facility:
      name: 'X-Facility-Id'
      in: 'header'
      required: true
      schema:
        type: 'string'
  schemas:
    Error:
      type: 'object'
      required: ['message']
      properties:
        message:
          type: 'string'
    Command:
      type: 'object'
      required: ['id']
      properties:
        id:
          type: 'string'
        pass:
          type: 'string'
          format: 'uuid'
    Session:
      type: 'object'
      required:
        - token
        - account
        - name
        - workspaces
        - writes
        - facilityIds
        - expiresAt
        - facilityAccess
      properties:
        token:
          type: 'string'
          format: 'uuid'
        account:
          type: 'string'
        name:
          type: 'string'
        workspaces:
          type: 'array'
          items:
            type: 'string'
        writes:
          type: 'array'
          items:
            type: 'string'
        facilityIds:
          type: 'array'
          items:
            type: 'string'
        expiresAt:
          type: 'integer'
        facilityAccess:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FacilityAccess'
    Facility:
      type: 'object'
      required: ['id', 'tenantId', 'name', 'city', 'inpatient']
      properties:
        id:
          type: 'string'
        tenantId:
          type: 'string'
        name:
          type: 'string'
        city:
          type: 'string'
        inpatient:
          type: 'boolean'
        publicQueue:
          type: boolean
        configurationVersion:
          type: integer
        active:
          type: boolean
    Patient:
      type: 'object'
      required: ['id', 'tenantId', 'name', 'initials', 'age']
      properties:
        id:
          type: 'string'
        tenantId:
          type: 'string'
        name:
          type: 'string'
        initials:
          type: 'string'
        age:
          type: 'integer'
    Practitioner:
      type: 'object'
      required: ['id', 'facilityId', 'name', 'specialty']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        name:
          type: 'string'
        specialty:
          type: 'string'
    Appointment:
      type: 'object'
      required:
        ['id', 'facilityId', 'patientId', 'practitionerId', 'time', 'day', 'channel', 'status']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        patientId:
          type: 'string'
        practitionerId:
          type: 'string'
        time:
          type: 'string'
        day:
          type: 'string'
          format: 'date'
        channel:
          type: 'string'
          enum: ['Scheduled', 'Walk-in']
        status:
          type: 'string'
          enum: ['Booked', 'Checked in', 'In consultation', 'Completed', 'Cancelled']
        version:
          type: integer
    Ticket:
      type: 'object'
      required: ['id', 'facilityId', 'appointmentId', 'number', 'arrivedAt', 'status']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        appointmentId:
          type: 'string'
        number:
          type: 'integer'
        arrivedAt:
          type: 'integer'
        status:
          type: 'string'
          enum: ['Waiting', 'Called', 'In consultation', 'Completed', 'Skipped']
        calledAt:
          type: 'integer'
        lastCalledAt:
          type: integer
    Encounter:
      type: 'object'
      required: ['id', 'facilityId', 'appointmentId', 'patientId', 'practitionerId', 'startedAt']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        appointmentId:
          type: 'string'
        patientId:
          type: 'string'
        practitionerId:
          type: 'string'
        startedAt:
          type: 'integer'
        signedAt:
          type: 'integer'
        observation:
          type: 'string'
    AppointmentRow:
      type: 'object'
      required: ['appointment', 'patient', 'practitioner']
      properties:
        appointment: { '$ref': '#/components/schemas/Appointment' }
        patient: { '$ref': '#/components/schemas/Patient' }
        practitioner: { '$ref': '#/components/schemas/Practitioner' }
        ticket: { '$ref': '#/components/schemas/Ticket' }
        encounter: { '$ref': '#/components/schemas/Encounter' }
    AppointmentPage:
      type: 'object'
      required: ['items', 'total']
      properties:
        items:
          type: 'array'
          items: { '$ref': '#/components/schemas/AppointmentRow' }
        total:
          type: 'integer'
    AccessOptions:
      type: 'object'
      required: ['practitioners', 'patients']
      properties:
        practitioners:
          type: 'array'
          items: { '$ref': '#/components/schemas/Practitioner' }
        patients:
          type: 'array'
          items: { '$ref': '#/components/schemas/Patient' }
    Alert:
      type: 'object'
      required: ['id', 'facilityId', 'title', 'detail', 'time', 'severity', 'acknowledged']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        title:
          type: 'string'
        detail:
          type: 'string'
        time:
          type: 'string'
        severity:
          type: 'string'
          enum: ['Priority', 'Attention', 'Information']
        acknowledged:
          type: 'boolean'
    Dashboard:
      type: 'object'
      required: ['days', 'metrics', 'departments', 'alerts', 'appointments']
      properties:
        days:
          type: 'array'
          items:
            type: 'object'
            required: ['day', 'scheduled', 'walkIn']
            properties:
              day:
                type: 'string'
                format: 'date'
              scheduled:
                type: 'integer'
              walkIn:
                type: 'integer'
        metrics:
          type: 'object'
          required:
            [
              'appointments',
              'priorAppointments',
              'activeQueue',
              'averageWait',
              'bedCapacity',
              'bedsOccupied',
              'revenueMinor',
              'priorRevenueMinor',
            ]
          properties:
            appointments:
              type: 'integer'
            priorAppointments:
              type: 'integer'
            activeQueue:
              type: 'integer'
            averageWait:
              type: 'integer'
            bedCapacity:
              type: 'integer'
            bedsOccupied:
              type: 'integer'
            revenueMinor:
              type: 'integer'
            priorRevenueMinor:
              type: 'integer'
        departments:
          type: 'array'
          items:
            type: 'object'
            required: ['name', 'appointments', 'completed', 'waiting']
            properties:
              name:
                type: 'string'
              appointments:
                type: 'integer'
              completed:
                type: 'integer'
              waiting:
                type: 'integer'
        alerts:
          type: 'array'
          items: { '$ref': '#/components/schemas/Alert' }
        appointments:
          type: 'array'
          items: { '$ref': '#/components/schemas/AppointmentRow' }
    Bed:
      type: 'object'
      required: ['id', 'facilityId', 'label', 'ward', 'status']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        label:
          type: 'string'
        ward:
          type: 'string'
        status:
          type: 'string'
          enum: ['Available', 'Occupied', 'Cleaning', 'Maintenance']
    Admission:
      type: 'object'
      required: ['id', 'facilityId', 'patientId', 'requestedAt', 'status', 'version']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        patientId:
          type: 'string'
        requestedAt:
          type: 'integer'
        status:
          type: 'string'
          enum: ['Requested', 'Admitted', 'Discharged']
        version:
          type: 'integer'
        admittedAt:
          type: 'integer'
        dischargedAt:
          type: 'integer'
        bedId:
          type: 'string'
    InpatientBoard:
      type: 'object'
      required: ['beds', 'admissions']
      properties:
        beds:
          type: 'array'
          items: { '$ref': '#/components/schemas/Bed' }
        admissions:
          type: 'array'
          items:
            type: 'object'
            required: ['admission', 'patient']
            properties:
              admission: { '$ref': '#/components/schemas/Admission' }
              patient: { '$ref': '#/components/schemas/Patient' }
    LabOrder:
      type: 'object'
      required:
        [
          'id',
          'facilityId',
          'encounterId',
          'patientId',
          'test',
          'status',
          'orderedAt',
          'changedAt',
          'version',
        ]
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        encounterId:
          type: 'string'
        patientId:
          type: 'string'
        test:
          type: 'string'
        status:
          type: 'string'
          enum: ['Ordered', 'Collected', 'Processing', 'Entered', 'Authorised', 'Published']
        orderedAt:
          type: 'integer'
        changedAt:
          type: 'integer'
        version:
          type: 'integer'
        accession:
          type: 'string'
        finding:
          type: 'string'
        authorisedBy:
          type: 'string'
    LabPage:
      type: 'object'
      required: ['statuses', 'items', 'total']
      properties:
        statuses:
          type: 'array'
          items:
            type: 'object'
            required: ['status', 'count']
            properties:
              status:
                type: 'string'
                enum: ['Ordered', 'Collected', 'Processing', 'Entered', 'Authorised', 'Published']
              count:
                type: 'integer'
        items:
          type: 'array'
          items:
            type: 'object'
            required: ['order', 'patient']
            properties:
              order: { '$ref': '#/components/schemas/LabOrder' }
              patient: { '$ref': '#/components/schemas/Patient' }
        total:
          type: 'integer'
    Invoice:
      type: 'object'
      required: ['id', 'facilityId', 'patientId', 'encounterId', 'day', 'lines']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        patientId:
          type: 'string'
        encounterId:
          type: 'string'
        day:
          type: 'string'
          format: 'date'
        lines:
          type: 'array'
          items:
            type: 'object'
            required: ['description', 'unitMinor', 'quantity']
            properties:
              description:
                type: 'string'
              unitMinor:
                type: 'integer'
              quantity:
                type: 'integer'
        prescriptionId:
          type: string
    InvoiceRow:
      type: 'object'
      required: ['invoice', 'patient', 'totalMinor', 'balanceMinor']
      properties:
        invoice: { '$ref': '#/components/schemas/Invoice' }
        patient: { '$ref': '#/components/schemas/Patient' }
        totalMinor:
          type: 'integer'
        balanceMinor:
          type: 'integer'
    BillingOptions:
      type: 'object'
      required: ['services', 'encounters']
      properties:
        services:
          type: 'array'
          items:
            type: 'object'
            required: ['description', 'unitMinor']
            properties:
              description:
                type: 'string'
              unitMinor:
                type: 'integer'
        encounters:
          type: 'array'
          items:
            type: 'object'
            required: ['id', 'name', 'patientId']
            properties:
              id:
                type: 'string'
              name:
                type: 'string'
              patientId:
                type: 'string'
    Portal:
      type: 'object'
      required: ['patient', 'clinicians', 'appointments', 'records', 'invoices']
      properties:
        patient: { '$ref': '#/components/schemas/Patient' }
        clinicians:
          type: 'array'
          items: { '$ref': '#/components/schemas/Practitioner' }
        appointments:
          type: 'array'
          items:
            type: 'object'
            required: ['appointment', 'practitioner']
            properties:
              appointment: { '$ref': '#/components/schemas/Appointment' }
              practitioner: { '$ref': '#/components/schemas/Practitioner' }
              ticket: { '$ref': '#/components/schemas/Ticket' }
        records:
          type: 'array'
          items: { '$ref': '#/components/schemas/LabOrder' }
        invoices:
          type: 'array'
          items:
            type: 'object'
            required: ['id', 'day', 'totalMinor', 'balanceMinor']
            properties:
              id:
                type: 'string'
              day:
                type: 'string'
                format: 'date'
              totalMinor:
                type: 'integer'
              balanceMinor:
                type: 'integer'
    QueueDisplay:
      type: object
      required:
        - facility
        - calling
        - waiting
      properties:
        facility:
          type: string
        waiting:
          type: integer
        calling:
          type: array
          items:
            type: object
            required:
              - number
              - specialty
            properties:
              number:
                type: integer
              specialty:
                type: string
    Organisation:
      type: object
      required:
        - id
        - name
        - plan
      properties:
        id: &a1
          type: string
        name: *a1
        plan:
          type: string
          enum:
            - Clinic
            - Hospital
            - Network
        reviewedOn:
          type: string
          format: date
        subscriptionVersion:
          type: integer
    PlatformEvent:
      type: object
      required:
        - type
        - facilityId
        - entityId
        - occurredAt
      properties:
        type: &a1
          type: string
        facilityId: *a1
        entityId: *a1
        occurredAt:
          type: integer
        actor: *a1
    PlatformData:
      type: object
      required:
        - organisations
        - facilities
        - activity
        - staff
        - memberships
        - practitioners
      properties:
        organisations:
          type: array
          items:
            $ref: '#/components/schemas/Organisation'
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        activity:
          type: array
          items:
            $ref: '#/components/schemas/PlatformEvent'
        staff:
          type: array
          items:
            type: object
            properties:
              account: &a2
                type: string
              name: *a2
            required:
              - account
              - name
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/StaffMembership'
        practitioners:
          type: array
          items:
            $ref: '#/components/schemas/Practitioner'
    FacilityAccess:
      type: object
      properties:
        workspaces:
          type: array
          items: &a2
            type: string
        writes:
          type: array
          items: *a2
        practitionerId: *a2
      required:
        - workspaces
        - writes
    StaffMembership:
      type: object
      properties:
        id: &a2
          type: string
        account: *a2
        facilityId: *a2
        role: *a2
        practitionerId: *a2
        active:
          type: boolean
        version:
          type: integer
      required:
        - id
        - account
        - facilityId
        - role
        - active
        - version
    SubscriptionRow:
      type: object
      properties:
        organisation:
          $ref: '#/components/schemas/Organisation'
        facilities: &a2
          type: integer
        activeFacilities: *a2
        inpatientFacilities: *a2
        nextReview:
          type: string
          format: date
      required:
        - organisation
        - facilities
        - activeFacilities
        - inpatientFacilities
        - nextReview
    NetworkFacilityMetrics:
      type: object
      properties:
        facility:
          type: object
          properties:
            id: &a2
              type: string
            name: *a2
            city: *a2
            inpatient:
              type: boolean
          required:
            - id
            - name
            - city
            - inpatient
        metrics:
          $ref: '#/components/schemas/Dashboard/properties/metrics'
        departments:
          $ref: '#/components/schemas/Dashboard/properties/departments'
      required:
        - facility
        - metrics
        - departments
    PharmacyPrescription:
      type: object
      properties:
        id: &a2
          type: string
        facilityId: *a2
        encounterId: *a2
        patientId: *a2
        practitionerId: *a2
        productId: *a2
        signedBy: *a2
        lotId: *a2
        invoiceId: *a2
        quantity: &a3
          type: integer
        status:
          type: string
          enum:
            - Draft
            - Signed
            - Dispensed
        createdAt: *a3
        signedAt: *a3
        dispensedAt: *a3
      required:
        - id
        - facilityId
        - encounterId
        - patientId
        - practitionerId
        - productId
        - quantity
        - status
        - createdAt
    StockLot:
      type: object
      properties:
        id: &a2
          type: string
        facilityId: *a2
        productId: *a2
        batch: *a2
        expiresOn:
          type: string
          format: date
        onHand:
          type: integer
      required:
        - id
        - facilityId
        - productId
        - batch
        - expiresOn
        - onHand
    PharmacyData:
      type: object
      properties:
        prescriptions:
          type: array
          items:
            type: object
            properties:
              prescription:
                $ref: '#/components/schemas/PharmacyPrescription'
              patient:
                type: object
                properties:
                  id: &a2
                    type: string
                  name: *a2
                required:
                  - id
                  - name
            required:
              - prescription
              - patient
        lots:
          type: array
          items:
            $ref: '#/components/schemas/StockLot'
      required:
        - prescriptions
        - lots
    PlatformIncident:
      type: object
      required:
        - id
        - title
        - service
        - priority
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id: &a4
          type: string
        title: *a4
        service: *a4
        priority: *a4
        status:
          type: string
          enum:
            - Open
            - Investigating
            - Resolved
        version: &a5
          type: integer
        createdAt: *a5
        updatedAt: *a5
    PlatformOperationsData:
      type: object
      required:
        - incidents
        - activeSessions
        - eventsToday
