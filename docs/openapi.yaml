openapi: '3.1.0'
info:
  title: 'TrueCare evaluation API'
  version: '0.1.0'
  description: 'Browser-local contract. Dates use Asia/Kolkata, timestamps are
    Unix milliseconds, and currency is INR in integer minor units.'
servers:
  - url: '/api/v1'
security:
  - sessionToken: []
paths:
  '/session':
    post:
      operationId: 'createSession'
      summary: 'Authenticate an evaluation account.'
      security: []
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['account', 'password']
              properties:
                account:
                  type: 'string'
                password:
                  type: 'string'
                  format: 'password'
      responses:
        '201':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Session' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
    get:
      operationId: 'getSession'
      summary: 'Restore a valid session.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Session' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
    delete:
      operationId: 'endSession'
      summary: 'End the session.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema:
                type: 'object'
                required: ['signedOut']
                properties:
                  signedOut:
                    type: 'boolean'
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/facilities':
    get:
      operationId: 'listFacilities'
      summary: 'List assigned facilities.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema:
                type: 'array'
                items: { '$ref': '#/components/schemas/Facility' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/overview':
    get:
      operationId: 'getOverview'
      summary: 'Read hospital metrics and activity.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'day'
          in: 'query'
          schema:
            type: 'string'
            format: 'date'
          description: 'Defaults to today in Asia/Kolkata.'
        - name: 'range'
          in: 'query'
          schema:
            type: 'integer'
            enum: [7, 14]
          description: 'Number of dates in the trend.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Dashboard' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/patients':
    get:
      operationId: 'findPatients'
      summary: 'Search up to 35 tenant patients.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'q'
          in: 'query'
          schema:
            type: 'string'
          description: 'Case-insensitive search.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/AccessOptions' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
    post:
      operationId: 'registerPatient'
      summary: 'Register a fictional patient from an issued code.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['registrationCode']
              properties:
                registrationCode:
                  type: 'string'
                  pattern: '^REG-[0-9]{4}$'
      responses:
        '201':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Command' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/appointments/options':
    get:
      operationId: 'getBookingOptions'
      summary: 'Read available patient and clinician choices.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'q'
          in: 'query'
          schema:
            type: 'string'
          description: 'Case-insensitive search.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/AccessOptions' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/admissions/options':
    get:
      operationId: 'getAdmissionOptions'
      summary: 'Read eligible patient choices.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'q'
          in: 'query'
          schema:
            type: 'string'
          description: 'Case-insensitive search.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/AccessOptions' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/appointments':
    get:
      operationId: 'listAppointments'
      summary: 'List appointments for a facility and date.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'day'
          in: 'query'
          schema:
            type: 'string'
            format: 'date'
          description: 'Defaults to today in Asia/Kolkata.'
        - name: 'q'
          in: 'query'
          schema:
            type: 'string'
          description: 'Case-insensitive search.'
        - name: 'status'
          in: 'query'
          schema:
            type: 'string'
          description: 'Filter by lifecycle state.'
        - name: 'offset'
          in: 'query'
          schema:
            type: 'integer'
          description: 'Zero-based offset. Returns up to 12 rows.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/AppointmentPage' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
    post:
      operationId: 'bookAppointment'
      summary: 'Reserve a slot and issue an opaque pass.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['patientId', 'practitionerId', 'time', 'day']
              properties:
                patientId:
                  type: 'string'
                practitionerId:
                  type: 'string'
                time:
                  type: 'string'
                day:
                  type: 'string'
                  format: 'date'
                channel:
                  type: 'string'
                  enum: ['Scheduled', 'Walk-in']
      responses:
        '201':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Command' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/queue':
    get:
      operationId: 'listQueue'
      summary: 'List current queue tickets.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'day'
          in: 'query'
          schema:
            type: 'string'
            format: 'date'
          description: 'Defaults to today in Asia/Kolkata.'
        - name: 'q'
          in: 'query'
          schema:
            type: 'string'
          description: 'Case-insensitive search.'
        - name: 'status'
          in: 'query'
          schema:
            type: 'string'
          description: 'Filter by lifecycle state.'
        - name: 'offset'
          in: 'query'
          schema:
            type: 'integer'
          description: 'Zero-based offset. Returns up to 12 rows.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/AppointmentPage' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/clinical':
    get:
      operationId: 'listConsultations'
      summary: 'List assigned consultations.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'day'
          in: 'query'
          schema:
            type: 'string'
            format: 'date'
          description: 'Defaults to today in Asia/Kolkata.'
        - name: 'q'
          in: 'query'
          schema:
            type: 'string'
          description: 'Case-insensitive search.'
        - name: 'status'
          in: 'query'
          schema:
            type: 'string'
          description: 'Filter by lifecycle state.'
        - name: 'offset'
          in: 'query'
          schema:
            type: 'integer'
          description: 'Zero-based offset. Returns up to 12 rows.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/AppointmentPage' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/beds':
    get:
      operationId: 'getBedBoard'
      summary: 'Read ward beds and permitted admissions.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/InpatientBoard' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/laboratory':
    get:
      operationId: 'listLaboratory'
      summary: 'Read stage counts and specimen worklist.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'q'
          in: 'query'
          schema:
            type: 'string'
          description: 'Case-insensitive search.'
        - name: 'status'
          in: 'query'
          schema:
            type: 'string'
          description: 'Filter by lifecycle state.'
        - name: 'offset'
          in: 'query'
          schema:
            type: 'integer'
          description: 'Zero-based offset. Returns up to 12 rows.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/LabPage' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/billing':
    get:
      operationId: 'listInvoices'
      summary: 'List up to 200 invoices for a date.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'day'
          in: 'query'
          schema:
            type: 'string'
            format: 'date'
          description: 'Defaults to today in Asia/Kolkata.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema:
                type: 'array'
                items: { '$ref': '#/components/schemas/InvoiceRow' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/billing/options':
    get:
      operationId: 'getInvoiceOptions'
      summary: 'Read signed encounters and billable services.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
        - name: 'day'
          in: 'query'
          schema:
            type: 'string'
            format: 'date'
          description: 'Defaults to today in Asia/Kolkata.'
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/BillingOptions' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/portal':
    get:
      operationId: 'getPatientPortal'
      summary: "Read the signed-in patient's own visits, released reports and bills."
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      responses:
        '200':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Portal' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/portal/appointments':
    post:
      operationId: 'bookMyAppointment'
      summary: 'Reserve a slot for the signed-in patient.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['practitionerId', 'time', 'day']
              properties:
                practitionerId:
                  type: 'string'
                time:
                  type: 'string'
                day:
                  type: 'string'
                  format: 'date'
      responses:
        '201':
          description: 'Success.'
