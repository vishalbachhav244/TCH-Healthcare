      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['appointmentId', 'observation']
              properties:
                appointmentId:
                  type: 'string'
