      operationId: 'completeConsultation'
      summary: 'Sign an observation and complete the encounter.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['appointmentId', 'observation']
              properties:
                appointmentId:
                  type: 'string'
                observation:
                  type: 'string'
      responses:
        '201':
          description: 'Success.'
