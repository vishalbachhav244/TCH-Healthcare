      required:
        - practitioners
        - waitlist
        - exceptions
      properties:
        practitioners:
          type: array
          items:
            $ref: "#/components/schemas/Practitioner"
        waitlist:
          type: array
          items:
            $ref: "#/components/schemas/WaitlistRow"
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleException"
    ContinuityClinician:
      type: object
      required:
        - id
        - name
        - specialty
      properties:
        id:
          type: string
        name:
          type: string
        specialty:
          type: string
    FollowUpSummary:
      type: object
      required:
        - id
        - clinician
        - startsOn
        - endsOn
        - status
        - version
      properties:
        id:
          type: string
        clinician:
          $ref: "#/components/schemas/ContinuityClinician"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        status:
          type: string
          enum:
            - To book
            - Booked
            - Completed
            - Withdrawn
            - Expired
        version:
          type: integer
          minimum: 0
        visit:
          type: object
          required:
            - day
            - time
          properties:
            day:
              type: string
              format: date
            time:
              type: string
    FollowUpDetails:
      type: object
      required:
        - id
        - clinician
        - startsOn
        - endsOn
        - status
        - version
        - purpose
      properties:
        id:
          type: string
        clinician:
          $ref: "#/components/schemas/ContinuityClinician"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        status:
          type: string
          enum:
            - To book
            - Booked
            - Completed
            - Withdrawn
            - Expired
        version:
          type: integer
          minimum: 0
        purpose:
          type: string
          enum:
            - Review progress
            - Review test results
            - Review care plan
        visit:
          type: object
          required:
            - day
            - time
          properties:
            day:
              type: string
              format: date
            time:
              type: string
    BookingContext:
      type: object
      required:
        - recentClinician
        - followUps
      properties:
        recentClinician:
          anyOf:
            - type: object
              required:
                - clinician
                - signedAt
              properties:
                clinician:
                  $ref: "#/components/schemas/ContinuityClinician"
                signedAt:
                  type: integer
                  minimum: 0
            - type: "null"
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpSummary"
    ClinicalContinuity:
      type: object
      required:
        - history
        - followUp
      properties:
        history:
          type: array
          items:
            type: object
            required:
              - id
              - clinician
              - signedAt
            properties:
              id:
                type: string
              clinician:
                $ref: "#/components/schemas/ContinuityClinician"
              signedAt:
                type: integer
                minimum: 0
              observation:
                type: string
        followUp:
          anyOf:
            - $ref: "#/components/schemas/FollowUpDetails"
            - type: "null"
    WardAssignmentOptions:
      type: object
      required:
        - physicians
        - nurses
        - assignment
      properties:
        physicians:
          type: array
          items:
            type: object
            required:
              - account
              - name
            properties:
              account:
                type: string
              name:
                type: string
        nurses:
          type: array
          items:
            type: object
            required:
              - account
              - name
            properties:
              account:
                type: string
              name:
                type: string
        assignment:
          anyOf:
            - type: object
              required:
                - physician
                - nurse
                - version
              properties:
                physician:
                  type: string
                nurse:
                  type: string
                version:
                  type: integer
                  minimum: 0
            - type: "null"
    WardWorklistRow:
      type: object
      required:
        - admission
        - patient
        - bed
        - openTasks
        - completedTasks
      properties:
        admission:
          type: object
          required:
            - id
            - version
          properties:
            id:
              type: string
            version:
              type: integer
              minimum: 0
            admittedAt:
              type: integer
              minimum: 0
        patient:
          type: object
          required:
            - id
            - name
            - initials
          properties:
            id:
              type: string
            name:
              type: string
            initials:
              type: string
        bed:
          type: object
          required:
            - label
            - ward
          properties:
            label:
              type: string
            ward:
              type: string
        openTasks:
          type: integer
          minimum: 0
        completedTasks:
          type: integer
          minimum: 0
    WardRoundEntry:
      type: object
      required:
        - id
        - actor
        - createdAt
        - focus
        - summary
      properties:
        id:
          type: string
        actor:
          type: string
        createdAt:
          type: integer
          minimum: 0
        focus:
          type: string
          enum:
            - Daily review
            - Post-admission review
            - Care coordination
        summary:
          type: string
          enum:
            - Reviewed with the ward team
            - Care plan discussed
            - Follow-up review requested
    WardObservationEntry:
      type: object
      required:
        - id
        - actor
        - createdAt
        - kind
        - result
      properties:
        id:
          type: string
        actor:
          type: string
        createdAt:
          type: integer
          minimum: 0
        kind:
          type: string
          enum:
            - Ward observations
            - Shift handover
            - Mobility assistance
            - Comfort check
        result:
          type: string
          enum:
            - Recorded
            - Physician review requested
        taskId:
          type: string
    WardOrderEntry:
      type: object
      required:
        - id
        - kind
        - physician
        - orderedAt
        - task
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - Record ward observations
            - Document shift handover
            - Confirm mobility assistance
        physician:
          type: string
        orderedAt:
          type: integer
          minimum: 0
        task:
          type: object
          required:
            - id
            - status
            - version
            - updatedAt
            - updatedBy
          properties:
            id:
              type: string
            status:
              type: string
              enum:
                - Pending
                - In progress
                - Completed
                - Cancelled
            version:
              type: integer
              minimum: 0
            updatedAt:
              type: integer
              minimum: 0
            updatedBy:
              type: string
    WardDetail:
      type: object
      required:
        - admission
        - patient
        - bed
        - team
        - rounds
        - observations
        - orders
      properties:
        admission:
          type: object
          required:
            - id
            - version
          properties:
            id:
              type: string
            version:
              type: integer
              minimum: 0
            admittedAt:
              type: integer
              minimum: 0
        patient:
          type: object
          required:
            - id
            - name
            - initials
          properties:
            id:
              type: string
            name:
              type: string
            initials:
              type: string
        bed:
          type: object
          required:
            - label
            - ward
          properties:
            label:
              type: string
            ward:
              type: string
        team:
          type: object
          required:
            - physician
            - nurse
            - version
          properties:
            physician:
              type: string
            nurse:
              type: string
            version:
              type: integer
              minimum: 0
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/WardRoundEntry"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/WardObservationEntry"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/WardOrderEntry"
  responses:
    Error401:
      description: 'Missing or expired session.'
      content:
        'application/json':
          schema: { '$ref': '#/components/schemas/Error' }
    Error403:
      description: 'Scope or action denied.'
      content:
        'application/json':
          schema: { '$ref': '#/components/schemas/Error' }
    Error404:
      description: 'Resource unavailable.'
      content:
        'application/json':
          schema: { '$ref': '#/components/schemas/Error' }
    Error409:
      description: 'Conflict or stale state.'
      content:
        'application/json':
          schema: { '$ref': '#/components/schemas/Error' }
    Error422:
      description: 'Invalid fields.'
      content:
        'application/json':
          schema: { '$ref': '#/components/schemas/Error' }
    Error503:
      description: 'Evaluation unavailable.'
      content:
        'application/json':
          schema: { '$ref': '#/components/schemas/Error' }
