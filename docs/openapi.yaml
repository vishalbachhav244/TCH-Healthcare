    StockMovement:
      type: object
      required:
        - id
        - facilityId
        - lotId
        - at
        - actor
        - quantity
        - kind
      properties:
        id:
          type: string
        facilityId:
          type: string
        lotId:
          type: string
        at:
          type: integer
          minimum: 0
        actor:
          type: string
        quantity:
          type: integer
        kind:
          type: string
          enum:
            - Opening balance
            - Received
            - Dispensed
            - Supplier return
            - Patient return
            - Count adjustment
        reference:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{2,23}$
        prescriptionId:
          type: string
        invoiceId:
          type: string
        creditMinor:
          type: integer
          minimum: 0
        reviewMinor:
          type: integer
          minimum: 0
        reason:
          anyOf:
            - type: string
              enum:
                - Supplier recall
                - Damaged stock
                - Expired stock
                - Incorrect shipment
            - type: string
              enum:
                - Unused medication returned
                - Dispensing discrepancy
                - Patient declined supply
            - type: string
              enum:
                - Cycle count
                - Recount after discrepancy
        purchaseOrderId:
          type: string
        purchaseOrderReference:
          type: string
        countedOnHand:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              kind:
                const: Received
          then:
            required:
              - reference
        - if:
            properties:
              kind:
                const: Dispensed
          then:
            required:
              - prescriptionId
        - if:
            properties:
              kind:
                const: Supplier return
          then:
            required:
              - reference
              - reason
            properties:
              reason:
                type: string
                enum:
                  - Supplier recall
                  - Damaged stock
                  - Expired stock
                  - Incorrect shipment
        - if:
            properties:
              kind:
                const: Patient return
          then:
            required:
              - reference
              - reason
              - prescriptionId
              - invoiceId
              - creditMinor
              - reviewMinor
            properties:
              reason:
                type: string
                enum:
                  - Unused medication returned
                  - Dispensing discrepancy
                  - Patient declined supply
        - if:
            properties:
              kind:
                const: Count adjustment
          then:
            required:
              - reference
              - reason
              - countedOnHand
            properties:
              reason:
                type: string
                enum:
                  - Cycle count
                  - Recount after discrepancy
