        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/clinical/lab-orders':
    post:
      operationId: 'orderLabTest'
      summary: 'Order a test from an open assigned encounter.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['encounterId', 'test']
              properties:
                encounterId:
                  type: 'string'
                test:
                  type: 'string'
      responses:
        '201':
          description: 'Success.'
          content:
            'application/json':
              schema: { '$ref': '#/components/schemas/Command' }
        '401': { '$ref': '#/components/responses/Error401' }
        '403': { '$ref': '#/components/responses/Error403' }
        '404': { '$ref': '#/components/responses/Error404' }
        '409': { '$ref': '#/components/responses/Error409' }
        '422': { '$ref': '#/components/responses/Error422' }
        '503': { '$ref': '#/components/responses/Error503' }
  '/laboratory/advance':
    post:
      operationId: 'advanceLabOrder'
      summary: 'Move a specimen to the next authorised stage.'
      parameters:
        - { '$ref': '#/components/parameters/Facility' }
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: 'object'
              required: ['orderId', 'version']
              properties:
                orderId:
                  type: 'string'
                version:
                  type: 'string'
