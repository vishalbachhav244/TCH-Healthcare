components:
  securitySchemes:
    sessionToken:
      type: 'http'
      scheme: 'bearer'
      bearerFormat: 'opaque evaluation token'
  parameters:
    Facility:
      name: 'X-Facility-Id'
      in: 'header'
      required: true
      schema:
        type: 'string'
  schemas:
    Error:
      type: 'object'
      required: ['message']
      properties:
        message:
          type: 'string'
    Command:
      type: 'object'
      required: ['id']
      properties:
        id:
          type: 'string'
        pass:
          type: 'string'
          format: 'uuid'
    Session:
      type: 'object'
      required:
        - token
        - account
        - name
        - workspaces
        - writes
        - facilityIds
        - expiresAt
        - facilityAccess
      properties:
        token:
          type: 'string'
          format: 'uuid'
        account:
          type: 'string'
        name:
          type: 'string'
        workspaces:
          type: 'array'
          items:
            type: 'string'
        writes:
          type: 'array'
          items:
            type: 'string'
        facilityIds:
          type: 'array'
          items:
            type: 'string'
        expiresAt:
          type: 'integer'
        facilityAccess:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FacilityAccess'
    Facility:
      type: 'object'
      required: ['id', 'tenantId', 'name', 'city', 'inpatient']
      properties:
        id:
          type: 'string'
        tenantId:
          type: 'string'
        name:
          type: 'string'
        city:
          type: 'string'
        inpatient:
          type: 'boolean'
        publicQueue:
          type: boolean
        configurationVersion:
          type: integer
        active:
          type: boolean
    Patient:
      type: 'object'
      required: ['id', 'tenantId', 'name', 'initials', 'age']
      properties:
        id:
          type: 'string'
        tenantId:
          type: 'string'
        name:
          type: 'string'
        initials:
          type: 'string'
        age:
          type: 'integer'
    Practitioner:
      type: 'object'
      required: ['id', 'facilityId', 'name', 'specialty']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        name:
          type: 'string'
        specialty:
          type: 'string'
    Appointment:
      type: 'object'
      required:
        ['id', 'facilityId', 'patientId', 'practitionerId', 'time', 'day', 'channel', 'status']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        patientId:
          type: 'string'
        practitionerId:
          type: 'string'
        time:
          type: 'string'
        day:
          type: 'string'
          format: 'date'
        channel:
          type: 'string'
          enum: ['Scheduled', 'Walk-in']
        status:
          type: 'string'
          enum: ['Booked', 'Checked in', 'In consultation', 'Completed', 'Cancelled']
        version:
          type: integer
        followUpId:
          type: string
    Ticket:
      type: 'object'
      required: ['id', 'facilityId', 'appointmentId', 'number', 'arrivedAt', 'status']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        appointmentId:
          type: 'string'
        number:
          type: 'integer'
        arrivedAt:
          type: 'integer'
        status:
          type: 'string'
          enum: ['Waiting', 'Called', 'In consultation', 'Completed', 'Skipped']
        calledAt:
          type: 'integer'
        lastCalledAt:
          type: integer
    Encounter:
      type: 'object'
      required: ['id', 'facilityId', 'appointmentId', 'patientId', 'practitionerId', 'startedAt']
