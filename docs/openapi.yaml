components:
  securitySchemes:
    sessionToken:
      type: 'http'
      scheme: 'bearer'
      bearerFormat: 'opaque evaluation token'
  parameters:
    Facility:
      name: 'X-Facility-Id'
      in: 'header'
      required: true
      schema:
        type: 'string'
  schemas:
    Error:
      type: 'object'
      required: ['message']
      properties:
        message:
          type: 'string'
    Command:
      type: 'object'
      required: ['id']
      properties:
        id:
          type: 'string'
        pass:
          type: 'string'
          format: 'uuid'
    Session:
      type: 'object'
      required:
        - token
        - account
        - name
        - workspaces
        - writes
        - facilityIds
        - expiresAt
        - facilityAccess
      properties:
        token:
          type: 'string'
          format: 'uuid'
        account:
          type: 'string'
        name:
          type: 'string'
        workspaces:
          type: 'array'
          items:
            type: 'string'
        writes:
          type: 'array'
          items:
            type: 'string'
        facilityIds:
          type: 'array'
          items:
            type: 'string'
        expiresAt:
          type: 'integer'
        facilityAccess:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FacilityAccess'
    Facility:
      type: 'object'
      required: ['id', 'tenantId', 'name', 'city', 'inpatient']
      properties:
        id:
          type: 'string'
        tenantId:
          type: 'string'
        name:
          type: 'string'
        city:
          type: 'string'
        inpatient:
          type: 'boolean'
        publicQueue:
          type: boolean
        configurationVersion:
          type: integer
        active:
          type: boolean
    Patient:
      type: 'object'
      required: ['id', 'tenantId', 'name', 'initials', 'age']
      properties:
        id:
          type: 'string'
        tenantId:
          type: 'string'
        name:
          type: 'string'
        initials:
          type: 'string'
        age:
          type: 'integer'
    Practitioner:
      type: 'object'
      required: ['id', 'facilityId', 'name', 'specialty']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        name:
          type: 'string'
        specialty:
          type: 'string'
    Appointment:
      type: 'object'
      required:
        ['id', 'facilityId', 'patientId', 'practitionerId', 'time', 'day', 'channel', 'status']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        patientId:
          type: 'string'
        practitionerId:
          type: 'string'
        time:
          type: 'string'
        day:
          type: 'string'
          format: 'date'
        channel:
          type: 'string'
          enum: ['Scheduled', 'Walk-in']
        status:
          type: 'string'
          enum: ['Booked', 'Checked in', 'In consultation', 'Completed', 'Cancelled']
        version:
          type: integer
        followUpId:
          type: string
    Ticket:
      type: 'object'
      required: ['id', 'facilityId', 'appointmentId', 'number', 'arrivedAt', 'status']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        appointmentId:
          type: 'string'
        number:
          type: 'integer'
        arrivedAt:
          type: 'integer'
        status:
          type: 'string'
          enum: ['Waiting', 'Called', 'In consultation', 'Completed', 'Skipped']
        calledAt:
          type: 'integer'
        lastCalledAt:
          type: integer
    Encounter:
      type: 'object'
      required: ['id', 'facilityId', 'appointmentId', 'patientId', 'practitionerId', 'startedAt']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        appointmentId:
          type: 'string'
        patientId:
          type: 'string'
        practitionerId:
          type: 'string'
        startedAt:
          type: 'integer'
        signedAt:
          type: 'integer'
        observation:
          type: 'string'
    AppointmentRow:
      type: 'object'
      required: ['appointment', 'patient', 'practitioner']
      properties:
        appointment: { '$ref': '#/components/schemas/Appointment' }
        patient: { '$ref': '#/components/schemas/Patient' }
        practitioner: { '$ref': '#/components/schemas/Practitioner' }
        ticket: { '$ref': '#/components/schemas/Ticket' }
        encounter: { '$ref': '#/components/schemas/Encounter' }
    AppointmentPage:
      type: 'object'
      required: ['items', 'total']
      properties:
        items:
          type: 'array'
          items: { '$ref': '#/components/schemas/AppointmentRow' }
        total:
          type: 'integer'
    AccessOptions:
      type: 'object'
      required: ['practitioners', 'patients']
      properties:
        practitioners:
          type: 'array'
          items: { '$ref': '#/components/schemas/Practitioner' }
        patients:
          type: 'array'
          items: { '$ref': '#/components/schemas/Patient' }
    Alert:
      type: 'object'
      required: ['id', 'facilityId', 'title', 'detail', 'time', 'severity', 'acknowledged']
      properties:
        id:
          type: 'string'
        facilityId:
          type: 'string'
        title:
          type: 'string'
        detail:
          type: 'string'
        time:
          type: 'string'
        severity:
          type: 'string'
          enum: ['Priority', 'Attention', 'Information']
        acknowledged:
          type: 'boolean'
    Dashboard:
      type: 'object'
      required: ['days', 'metrics', 'departments', 'alerts', 'appointments']
      properties:
        days:
          type: 'array'
          items:
            type: 'object'
            required: ['day', 'scheduled', 'walkIn']
            properties:
              day:
                type: 'string'
                format: 'date'
              scheduled:
                type: 'integer'
              walkIn:
                type: 'integer'
        metrics:
          type: 'object'
          required:
            [
              'appointments',
              'priorAppointments',
              'activeQueue',
              'averageWait',
              'bedCapacity',
              'bedsOccupied',
              'revenueMinor',
              'priorRevenueMinor',
            ]
          properties:
            appointments:
              type: 'integer'
            priorAppointments:
              type: 'integer'
            activeQueue:
              type: 'integer'
            averageWait:
              type: 'integer'
